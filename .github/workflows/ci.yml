# Build, test, ship. Two legs:
#
#   test  -- ruff, strict mypy, and pytest against a real Postgres. The
#            Postgres-backed tests fail rather than skip without a database,
#            so the service container is not optional here.
#   image -- the Docker image, built for amd64 + arm64 on every push and PR
#            (a PR proves the image still builds; only pushes publish).
#            Publishes to GHCR always, and to Docker Hub once
#            DOCKERHUB_USERNAME / DOCKERHUB_TOKEN exist as repository secrets.
#
# Tags: a push to main publishes `latest` and `sha-<commit>`; a `vX.Y.Z` git
# tag publishes `X.Y.Z`, `X.Y` and `latest`.

name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: uratori
          POSTGRES_PASSWORD: uratori
          POSTGRES_DB: uratori_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U uratori -d uratori_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://uratori:uratori@localhost:5432/uratori_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[server,dev]"
      - run: ruff check uratori tests
      - run: mypy uratori
      - run: pytest

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image names and tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          # The Docker Hub name rides on the same secret that unlocks its
          # login, so a fork publishes under its own namespace or not at all.
          images: |
            ghcr.io/${{ github.repository }}
            name=docker.io/${{ env.DOCKERHUB_USERNAME }}/uratori,enable=${{ env.DOCKERHUB_USERNAME != '' }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('sha-{0}', github.sha) }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
