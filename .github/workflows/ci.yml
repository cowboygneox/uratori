# Build, test, ship. Two legs:
#
#   test  -- ruff, strict mypy, and pytest against a real Postgres. The
#            Postgres-backed tests fail rather than skip without a database,
#            so the service container is not optional here.
#   image -- the Docker image, built for amd64 + arm64 on every push and PR
#            (a PR proves the image still builds; only pushes publish).
#            Publishes to GHCR always, and to Docker Hub once
#            DOCKERHUB_USERNAME / DOCKERHUB_TOKEN exist as repository secrets.
#
# Tags: a push to main publishes `latest` and `sha-<commit>`; a `vX.Y.Z` git
# tag publishes `X.Y.Z`, `X.Y` and `latest`.

name: CI

on:
  push:
    branches: [main]
    # Semver only: a looser glob (v2, v1.0-beta) would slip past the semver
    # tag rules below and publish nothing but a sha tag, silently.
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  pull_request:

permissions:
  contents: read

# Two quick merges must not race for `latest`: runs on the same ref queue up
# behind each other instead. Never cancelled -- a half-published image is
# worse than a late one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: uratori
          POSTGRES_PASSWORD: uratori
          POSTGRES_DB: uratori_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U uratori -d uratori_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://uratori:uratori@localhost:5432/uratori_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[server,dev]"
      - run: ruff check uratori tests examples
      - run: mypy uratori examples/nfl/load.py
      - run: pytest

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      # Both secrets or neither: with only the username set, login-action
      # throws "Password required" and takes the GHCR publish down with it.
      # (`secrets` is unavailable in step `if:`s, hence the env hoist.)
      DOCKERHUB_ENABLED: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && env.DOCKERHUB_ENABLED == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image names and tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          # The Docker Hub name rides on the same secret that unlocks its
          # login, so a fork publishes under its own namespace or not at all.
          images: |
            ghcr.io/${{ github.repository }}
            name=docker.io/${{ env.DOCKERHUB_USERNAME }}/uratori,enable=${{ env.DOCKERHUB_ENABLED == 'true' }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # /health must report the tag a deploy pulled, or the "deploy check"
      # the docs sell is comparing two spellings of the same build: releases
      # strip the v (image tag 0.2.0, not v0.2.0), main pushes use the same
      # 7-char sha the image tag carries.
      - name: App version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=sha-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.ver.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
