[project]
name = "uratori"
# Bumped in the same commit a release is tagged from: the tag names the
# release and this field is what an installed copy reports, and the two
# disagreeing means `importlib.metadata.version` tells a host it is running
# an engine it is not.
version = "0.29.0"
description = "A definition engine: figures, readings and projections compiled from versioned definitions, computed incrementally over facts."
readme = "README.md"
# BUSL, not Apache or FSL: production use is granted for everything except the
# one thing worth preventing, and unlike FSL the prohibited space is *named* in
# the binding text -- the Additional Use Grant in LICENSE spells out
# project-management / software-delivery insights, so a competitor cannot read
# ambiguity into "products we offer". Each release converts to Apache-2.0 four
# years after it ships -- the longest window BUSL permits.
license = "BUSL-1.1"
license-files = ["LICENSE"]
authors = [{ name = "Sean Freitag" }]
keywords = ["definitions", "metrics", "figures", "calculation-engine", "facts"]
requires-python = ">=3.12"
dependencies = [
    # The one runtime dependency, and it is the wire: every answer the engine
    # serves is a pydantic model, so a host gets a schema (and, through it,
    # generated client types) rather than a dict it has to describe twice.
    "pydantic>=2.9",
]

[project.optional-dependencies]
postgres = [
    "asyncpg>=0.30",
]
server = [
    # The deployable service: the engine behind HTTP and a websocket. Kept out
    # of the core dependencies so an embedding host pays for none of it.
    "asyncpg>=0.30",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]
documents = [
    # Document-shaped facts (`as document` / `as page of`, docs/documents.md):
    # rendering pages and reading their text layer, and OCR for the pages that
    # have none. pypdfium2 (BSD/Apache-2.0, ships Google's PDFium binary) --
    # never PyMuPDF, which is AGPL-3.0 and incompatible with distributing
    # under this project's BUSL. pytesseract is a thin wrapper around the
    # `tesseract` binary (Apache-2.0), installed separately (apt `tesseract-ocr`
    # in the image; `brew install tesseract` locally).
    "pypdfium2>=4.30",
    "pytesseract>=0.3.13",
    # FastAPI's Form/File parameters (the upload route is multipart: the
    # file plus an optional `record` JSON object of host fields) need this
    # at import time, not just at request time.
    "python-multipart>=0.0.12",
]
dev = [
    "pytest>=8.3",
    # 0.26 introduced `asyncio_default_test_loop_scope`, which the pytest
    # config below depends on: an older resolve would silently fall back to
    # per-test loops -- the exact failure the session-scope setting prevents.
    "pytest-asyncio>=0.26",
    # A stream regression tends to surface as a socket that never sends the
    # next frame, and an unbounded receive_json turns that red test into a
    # CI hang. The global timeout is the backstop that makes it a failure.
    "pytest-timeout>=2.3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.28",
    # Pinned rather than floored, for the reason the host project pins them: an
    # unpinned checker means the local run and the CI run are different
    # programs, and the first symptom is a build that fails on a file nobody
    # touched.
    "mypy==2.3.1",
    "ruff==0.16.4",
    "asyncpg>=0.30",
    # asyncpg ships no py.typed. Without the stubs every row read is `Any`, and
    # the strict checker has nothing to say about the Postgres store -- which is
    # where a typo becomes a silently empty result.
    "asyncpg-stubs>=0.30",
    # Dev-only: generates the tiny PDF fixtures `tests/` and `examples/records/`
    # build in-process (a text page, a `/Rotate 90` page, an image-only page
    # for OCR) rather than committing binary files. BSD -- fpdf2 was
    # considered and passed over (LGPL-3.0-only).
    "reportlab>=4.2",
]

[project.urls]
Homepage = "https://github.com/cowboygneox/uratori"
Documentation = "https://github.com/cowboygneox/uratori/tree/main/docs"
Source = "https://github.com/cowboygneox/uratori"
Issues = "https://github.com/cowboygneox/uratori/issues"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["uratori"]

# The same strictness the host project runs, for the same reason: this package
# is, by volume, a compiler over closed unions, and `assert_never` plus a strict
# mypy is what makes a forgotten match arm a type error rather than a figure
# that silently answers None.
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_any_explicit = false
plugins = ["pydantic.mypy"]

# Constructor calls are part of the contract: without these two, a misspelled
# optional field in a model construction is silently dropped by pydantic and
# invisible to mypy -- exactly the shape of bug the wire models exist to refuse.
[tool.pydantic-mypy]
init_typed = true
init_forbid_extra = true

# Neither ships a py.typed marker; both are optional (the `documents` extra)
# and touched inside `uratori/server/documents.py`, which already types its
# own surface precisely and treats these two as untyped at the boundary, and
# inside `examples/records/generate.py`, the dev-only synthetic PDF
# generator that draws the same way `tests/pdf_fixtures.py` does.
[[tool.mypy.overrides]]
module = ["pypdfium2", "pytesseract", "reportlab.*"]
ignore_missing_imports = true

# `anthropic` ships its own types, but is not a dependency of this project
# at any tier -- `examples/records/author.py` is a development tool, never
# run by the server (documents-plan-v3, D4), and imports it lazily, inside
# the one function that calls out to it, for whoever runs the script to
# install themselves. Treated as untyped here only because it is absent
# from this checked environment by design, not because its own types are
# missing.
[[tool.mypy.overrides]]
module = ["anthropic"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    # A line of prose in a docstring is allowed to run long; the code is not,
    # and E501 already covers that.
    "E501",
    # PEP 695 `type X = ...` over `X: TypeAlias = ...`. Both are correct; the
    # explicit form is kept because an alias here is usually followed by a
    # docstring explaining what the type *means*.
    "UP040",
    "UP047",
    # Collapsing a nested `if` sometimes loses type narrowing that the arms were
    # carrying, and its autofix does exactly that.
    "SIM102",
    "SIM114",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# One event loop for the whole session, as in the host project: a loop per test
# hands the second test connections bound to a loop that has already closed.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
# Third-party deprecations we cannot fix: Starlette's testclient imports from
# anyio.abc.BlockingPortal (deprecated in favour of anyio.from_thread.BlockingPortal)
# and uses httpx instead of httpx2. Both happen at import time in code this project
# does not own; ignoring them narrowly here keeps the blanket escalation below intact
# for anything uratori itself does. The message text is stable API, so the first can
# be matched exactly; StarletteDeprecationWarning is scoped to Starlette's own warnings.
filterwarnings = [
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
    "ignore::starlette.testclient.StarletteDeprecationWarning",
    "error::DeprecationWarning",
]
# A regression in the push path shows up as a frame that never arrives, and
# an unbounded receive turns that into a hang instead of a red test.
timeout = 120
